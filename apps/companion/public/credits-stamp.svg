<svg xmlns="http://www.w3.org/2000/svg" width="740" height="74" viewBox="0 0 740 74" role="img" aria-labelledby="title desc">
  <title id="title">raumdock.org credits</title>
  <desc id="desc">raumdock.org - made by xheadwigx &amp; justcallmedeimos - infrastructure powered by twitch.tv/justcallmedeimos</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0" />
      <stop offset="0.2" stop-color="#00d4ff" stop-opacity="0.42" />
      <stop offset="0.52" stop-color="#f0a500" stop-opacity="0.46" />
      <stop offset="0.84" stop-color="#00d4ff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-glow" x="-8%" y="-60%" width="116%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#00d4ff" flood-opacity="0.22" />
    </filter>
  </defs>

  <g opacity="0">
