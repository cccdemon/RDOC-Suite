    <path d="M42 18 H698" stroke="url(#line)" stroke-width="1.4" />
    <path d="M42 56 H698" stroke="url(#line)" stroke-width="1.4" opacity="0.72" />
    <path d="M18 37 H58 M682 37 H722" stroke="#00d4ff" stroke-width="2" stroke-linecap="square" opacity="0.58" />
    <path d="M363 18 h14 M363 56 h14" stroke="#f0a500" stroke-width="2" stroke-linecap="square" opacity="0.72" />

    <text
