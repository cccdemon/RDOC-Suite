global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: rdoc-suite-bridge
    metrics_path: /metrics
    static_configs:
      - targets:
          - bridge:8787

  - job_name: rdoc-suite-livekit
    metrics_path: /metrics
    static_configs:
      - targets:
          - livekit:6789

  - job_name: rdoc-suite-relay-bots
    metrics_path: /metrics
    static_configs:
      - targets:
          - relay-bots:8788

  # Host CPU / RAM / disk. Scraped over the internal docker network only;
  # node-exporter publishes no host port.
  - job_name: rdoc-suite-node
    static_configs:
      - targets:
          - node-exporter:9100
