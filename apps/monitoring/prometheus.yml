global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: rdoc-suite-fleetplanner
    metrics_path: /metrics
    static_configs:
      - targets:
          - fleetplanner:3200

  - job_name: rdoc-suite-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  # Host CPU / RAM / disk. Scraped over the internal docker network only;
  # node-exporter publishes no host port.
  - job_name: rdoc-suite-node
    static_configs:
      - targets:
          - node-exporter:9100
