# fleetplanner-web — primary entry for /fleetplanner (FR-P2 cutover).
#
# Caddy strips the /fleetplanner public prefix and forwards here. This nginx is
# now the single front door for the whole app:
#   - SPA client routes  → index.html (React Router)
#   - hashed assets       → static, cached
#   - everything else     → the SSR/API backend (fleetplanner:3200): /api, /auth,
#     /discord, /e2e, and the SSR-only pages still served by the backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS — lets proxy_pass use a runtime-resolved variable so
  # nginx starts even if the backend is briefly unavailable.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend http://fleetplanner:3200;

  # Canonical security-header layer for the WHOLE app (SPA + proxied SSR/API).
  # The backend no longer sets these (it used to, causing duplicate+conflicting
  # headers on proxied responses — see apps/fleetplanner/src/app.ts). Server-level
  # add_header is inherited by every location that defines no add_header of its
  # own (the proxy `location /`, @ogbot, the /ops data endpoints). Locations that
  # DO set add_header (@spa, /assets/) must repeat the full block — add_header
  # replaces, never merges. CSP merges the backend's former stronger directives
  # (base-uri/object-src/form-action); SSR pages carry no inline <script> (only
  # inline styles + same-origin forms), so one CSP covers SPA and SSR alike.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

  # Defense-in-depth: strip any security header a backend route might still set,
  # so the nginx values above stay the single source of truth on proxied
  # responses (no silent reintroduction of the old duplicate/conflict).
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Content-Security-Policy;

  # Hashed assets cache forever; the entry document never. This location sets its
  # own add_header (Cache-Control), which replaces the inherited security headers,
  # so the full security block is repeated here (esp. nosniff for static JS/CSS).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
  }

  # Brand assets from the RDOC brandkit. Same situation as the SEO files below:
  # `location /` proxies everything unmatched to the SSR backend, so an
  # unlisted static file 404s even though Vite copied it to the html root.
  # (That is why /favicon.svg was already dead before the brandkit landed.)
  # These set add_header, which REPLACES the inherited security block, so the
  # full block is repeated - fonts in particular must keep nosniff.
  # Fonts get their own location because of the `types` block: it REPLACES the
  # inherited mime map, and the nginx image ships no mapping for .ttf, so these
  # would otherwise be served as application/octet-stream next to a nosniff
  # header. Icons stay separate so they keep the normal image mime types.
  location ~ ^/fonts/ {
    types { font/ttf ttf; font/woff2 woff2; font/woff woff; }
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
  }
  location ~ ^/icons/ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
  }
  location = /favicon.ico { try_files $uri =404; }
  location = /favicon.svg { try_files $uri =404; }
  location = /site.webmanifest { try_files $uri =404; }
  location = /og.png { try_files $uri =404; }
  location = /rdoc_logo_horizontal_dark.svg { try_files $uri =404; }
  location = /rdoc_logo_horizontal_light.svg { try_files $uri =404; }
  location = /rdoc_signet_copper.svg { try_files $uri =404; }

  # SEO crawl files. Static (Vite copies public/ to the html root). Exact-match
  # so they win over the catch-all `location /` backend proxy below, which would
  # otherwise forward them to the SSR backend. Caddy proxies the origin-root
  # suite.raumdock.org/robots.txt + /sitemap.xml here.
  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }
  # Google Search Console site-verification file (must live at the origin root).
  location = /google0c3c1ce4d4ba9739.html { try_files $uri =404; }

  # Backend per-op data/redirect endpoints under /ops: calendar export,
  # participants CSV, and the mission-cover editor save callback (redirect-only,
  # no HTML). The cover management UI itself (/ops/:id/cover) is an SPA route.
  location ~ ^/ops/[^/]+/(calendar\.ics|participants\.csv|cover/saved) {
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Swagger UI now lives in the SPA (/api-docs) with swagger-ui-dist bundled
  # same-origin, so the strict app CSP needs no CDN exception. The backend serves
  # only /api/v1/openapi.json (data).

  # ── SPA client routes → index.html ──────────────────────────────────
  # The entry document must NEVER be cached: hashed assets are immutable, but a
  # stale index.html keeps pointing browsers at an old bundle hash forever (the
  # "I deployed but still see the old UI" trap). All SPA routes funnel through
  # @spa so index.html is always served with no-store.
  # Landing: search engines + link-preview bots get the backend's indexable meta
  # doc (real text + canonical + structured data); humans get the SPA.
  location = / {
    error_page 420 = @ogbot;
    if ($http_user_agent ~* "(discordbot|twitterbot|facebookexternalhit|facebot|slackbot|slack-imgproxy|telegrambot|whatsapp|linkedinbot|redditbot|embedly|pinterest|skypeuripreview|googlebot|bingbot|applebot|vkshare|w3c_validator|baiduspider|duckduckbot|yandex|mastodon|iframely)") {
      return 420;
    }
    try_files $uri @spa;
  }
  # Op detail: link-preview bots get the backend's OpenGraph meta doc; humans get
  # the SPA. (return 420 → @ogbot keeps proxy headers out of an `if`.)
  location ~ ^/ops/[^/]+$ {
    error_page 420 = @ogbot;
    if ($http_user_agent ~* "(discordbot|twitterbot|facebookexternalhit|facebot|slackbot|slack-imgproxy|telegrambot|whatsapp|linkedinbot|redditbot|embedly|pinterest|skypeuripreview|googlebot|bingbot|applebot|vkshare|w3c_validator|baiduspider|mastodon|iframely)") {
      return 420;
    }
    try_files $uri @spa;
  }
  location /ops { try_files $uri @spa; }
  # Poll detail: link-preview bots get the backend's OpenGraph meta doc; humans
  # get the SPA. (mirrors the /ops/:id unfurl handling above)
  location ~ ^/polls/[^/]+$ {
    error_page 420 = @ogbot;
    if ($http_user_agent ~* "(discordbot|twitterbot|facebookexternalhit|facebot|slackbot|slack-imgproxy|telegrambot|whatsapp|linkedinbot|redditbot|embedly|pinterest|skypeuripreview|googlebot|bingbot|applebot|vkshare|w3c_validator|baiduspider|mastodon|iframely)") {
      return 420;
    }
    try_files $uri @spa;
  }
  location /polls { try_files $uri @spa; }
  location /calendar { try_files $uri @spa; }
  location /operationen { try_files $uri @spa; }
  location /ships { try_files $uri @spa; }
  location /templates { try_files $uri @spa; }
  location /feedback { try_files $uri @spa; }
  location /roadmap { try_files $uri @spa; }
  location /profile { try_files $uri @spa; }
  # exact /guilds = SPA server list; /guilds/added, /guilds/diagnostics etc.
  # keep falling through to the SSR backend (catch-all) below.
  location = /guilds { try_files $uri @spa; }
  location /guilds/fleet { try_files $uri @spa; }
  location /guilds/settings { try_files $uri @spa; }
  location /guilds/partnerships { try_files $uri @spa; }
  location /guilds/diagnostics { try_files $uri @spa; }
  location /admin { try_files $uri @spa; }
  location /login { try_files $uri @spa; }
  location /account { try_files $uri @spa; }
  location /konto { try_files $uri @spa; }
  # Static info/legal pages — migrated from SSR to the SPA DocPage.
  # IA merge B: docs hub + footer-level legal (deep links + legacy redirects).
  # Crawlers get the backend's indexable doc render (real text per section);
  # humans get the SPA. Regex location → takes precedence over the prefix ones.
  location ~ ^/(handbuch|rechtliches)(/|$) {
    error_page 420 = @ogbot;
    if ($http_user_agent ~* "(discordbot|twitterbot|facebookexternalhit|facebot|slackbot|slack-imgproxy|telegrambot|whatsapp|linkedinbot|redditbot|embedly|pinterest|skypeuripreview|googlebot|bingbot|applebot|vkshare|w3c_validator|baiduspider|duckduckbot|yandex|mastodon|iframely)") {
      return 420;
    }
    try_files $uri @spa;
  }
  location /impressum { try_files $uri @spa; }
  location /license { try_files $uri @spa; }
  location /why-unsigned { try_files $uri @spa; }
  location /how-to { try_files $uri @spa; }
  location /was-ist { try_files $uri @spa; }
  location /what-is { try_files $uri @spa; }
  location /privacy { try_files $uri @spa; }
  location /changelog { try_files $uri @spa; }
  location /sc-tools { try_files $uri @spa; }
  # Interactive API docs (Swagger UI) — SPA page rendering /api/v1/openapi.json.
  location /api-docs { try_files $uri @spa; }

  # Bot OpenGraph for /ops/:id → backend crawler meta route.
  location @ogbot {
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
  }

  location @spa {
    # add_header in a location replaces (does not inherit) the server-level set,
    # so the full security header block is repeated here for the HTML document.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
    try_files /index.html =404;
  }

  # ── everything else → backend (API, auth, discord, e2e, remaining SSR) ─
  location / {
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
  }
}
