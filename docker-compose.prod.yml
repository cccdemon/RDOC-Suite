# Production stack for the Commander LXC (10.10.10.97).
#
# TLS-Terminierung läuft NICHT hier — Traefik auf dem LXC-Host terminiert
# suite.raumdock.org routet:
#   /              -> 302 redirect to /fleetplanner (root has no own page)
#   /fleetplanner  -> http://127.0.0.1:3200  (fleetplanner, public entry point)
#   /  (other)     -> 302 redirect to /fleetplanner (legacy bridge UI removed)
# Traefik bekommt das Cert via Cloudflare-DNS-01 (siehe /etc/traefik/...).
#
# LXC 101 nginx macht weiterhin TCP-SNI-Passthrough auf :443
# -> 10.10.10.97:8443 (Traefik-websecure).
#
# LiveKit (WebRTC SFU) wurde 2026-06-18 entfernt (verwaist seit Voice-Removal
# 2026-06-12). Restore-Plan: docs/LIVEKIT-ARCHIVE-2026-06.md.
#
# Bring up:   docker compose -f docker-compose.prod.yml up -d
services:
  caddy-rdoc:
    build:
      context: .
      dockerfile: deploy/caddy-rdoc/Dockerfile
    image: rdoc-suite-caddy:latest
    container_name: rdoc-suite-caddy
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ./deploy/caddy-rdoc/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_rdoc_data:/data
      - caddy_rdoc_config:/config
      - ./downloads:/srv/downloads:ro
    depends_on:
      - fleetplanner
      - grafana
      - mission-cover
      - monitoring

  fleetplanner-db:
    image: postgres:16-alpine
    container_name: rdoc-suite-fleetplanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "fleetplanner"
      POSTGRES_PASSWORD: "${FLEETPLANNER_DB_PASSWORD}"
      POSTGRES_DB: "fleetplanner"
    volumes:
      - fleetplanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      # migrate deploy in the app entrypoint races the DB otherwise.
      test: ["CMD-SHELL", "pg_isready -U fleetplanner -d fleetplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  fleetplanner:
    build:
      context: .
      dockerfile: apps/fleetplanner/Dockerfile
    image: rdoc-suite-fleetplanner:latest
    container_name: rdoc-suite-fleetplanner
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3200"
      # Postgres lives in the fleetplanner-db service on the compose network.
      DATABASE_URL: "postgresql://fleetplanner:${FLEETPLANNER_DB_PASSWORD}@fleetplanner-db:5432/fleetplanner?schema=public"
      WEB_PUBLIC_URL: "${FLEETPLANNER_PUBLIC_URL:-https://suite.raumdock.org}"
      PUBLIC_BASE_PATH: "/fleetplanner"
      # Mission-cover microservice (FR-P4). Internal docker DNS; render API.
      MISSIONCOVER_SERVICE_URL: "${MISSIONCOVER_SERVICE_URL:-http://mission-cover:3300}"
      # MISSIONCOVER_SERVICE_SECRET comes from .env (shared with mission-cover).
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      # FR-P3 org-fleet: persistent cache for ship images pulled from Fleetyards.
      - fleetplanner_shipimg:/app/data/ship-images
    depends_on:
      fleetplanner-db:
        condition: service_healthy

  # FR-P2 Phase 3 — SPA frontend (read-only strangler slice against /api/v1).
  # NOT publicly routed yet: the proxy keeps serving the SSR app. Bound to
  # localhost only for shadow testing; Phase 4 wires /fleetplanner-next.
  fleetplanner-web:
    build:
      context: .
      dockerfile: apps/fleetplanner-web/Dockerfile
      args:
        # FR-P2 cutover: the SPA is now the primary /fleetplanner interface.
        BASE_PATH: "/fleetplanner/"
    image: rdoc-suite-fleetplanner-web:latest
    container_name: rdoc-suite-fleetplanner-web
    restart: unless-stopped
    # nginx here is the single front door for /fleetplanner and proxies API/auth
    # /SSR to the backend, so it must share the network + start after it.
    depends_on:
      - fleetplanner
    ports:
      - "127.0.0.1:3210:80"

  error-page:
    build:
      context: .
      dockerfile: apps/error-page/Dockerfile
    image: rdoc-suite-error-page:latest
    container_name: rdoc-suite-error-page
    restart: unless-stopped
    environment:
      PORT: "9091"
    ports:
      - "127.0.0.1:9091:9091"

  # Mission-cover render microservice (FR-P4). Self-contained: headless Chromium
  # renders the MissionCover engine bundle. The fleetplanner calls /v1/* over the
  # internal network; only /covers/*.png is published (via Caddy /cover/covers*).
  mission-cover:
    build:
      context: .
      dockerfile: apps/mission-cover/Dockerfile
    image: rdoc-suite-mission-cover:latest
    container_name: rdoc-suite-mission-cover
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3300"
      DATA_DIR: "/app/data/covers"
      MISSIONCOVER_PUBLIC_URL: "${MISSIONCOVER_PUBLIC_URL:-https://suite.raumdock.org/cover}"
      # MISSIONCOVER_SERVICE_SECRET comes from .env (min 32 chars). Must match
      # the value the fleetplanner sends.
    # Loopback only — Caddy (host network) proxies /cover/covers* here; the
    # fleetplanner reaches /v1 via the docker DNS name `mission-cover`.
    ports:
      - "127.0.0.1:3300:3300"
    volumes:
      - mission_cover_data:/app/data

  monitoring:
    build:
      context: .
      dockerfile: apps/monitoring/Dockerfile
    image: rdoc-suite-monitoring:latest
    container_name: rdoc-suite-monitoring
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - monitoring_data:/prometheus
    depends_on:
      - livekit
      - alertmanager
      - node-exporter
      - postgres-exporter
      - fleetplanner

  # Alert routing → Discord. No public port; UI bound to loopback only.
  # The Discord webhook URL is a host-side file secret (see
  # deploy/alertmanager/secret/discord-webhook-url).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: rdoc-suite-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/alertmanager/secret:/etc/alertmanager/secret:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  # Postgres metrics for the fleetplanner DB. No published port — scraped only
  # over the internal docker network. Never expose this to the internet.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: rdoc-suite-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://fleetplanner:${FLEETPLANNER_DB_PASSWORD}@fleetplanner-db:5432/fleetplanner?sslmode=disable"
    depends_on:
      - fleetplanner-db

  # Host CPU / RAM / disk metrics. No published port — scraped only over the
  # internal docker network by Prometheus. Never expose this to the internet.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: rdoc-suite-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run)($$|/)"
    pid: host
    volumes:
      - "/:/host:ro,rslave"

  grafana:
    image: grafana/grafana:latest
    container_name: rdoc-suite-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_SERVER_ROOT_URL: "https://monitoring.raumdock.org/"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - monitoring

volumes:
  caddy_rdoc_config:
  caddy_rdoc_data:
  fleetplanner_pgdata:
  fleetplanner_shipimg:
  grafana_data:
  mission_cover_data:
  monitoring_data:
  alertmanager_data:
