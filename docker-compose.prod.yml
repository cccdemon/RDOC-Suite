# Production stack for the Commander LXC (10.10.10.97).
#
# TLS-Terminierung läuft NICHT hier — Traefik auf dem LXC-Host terminiert
# suite.raumdock.org routet:
#   /      -> http://127.0.0.1:8787  (bridge / web interfaces)
# voice.raumdock.org routet:
#   /      -> http://127.0.0.1:7880  (livekit signaling)
# Traefik bekommt das Cert via Cloudflare-DNS-01 (siehe /etc/traefik/...).
#
# LXC 101 nginx macht weiterhin TCP-SNI-Passthrough auf :443
# -> 10.10.10.97:8443 (Traefik-websecure).
# WebRTC-Media (7881/tcp, 7882/udp) wird von LXC 101 direkt via iptables-DNAT
# auf 10.10.10.97 weitergeleitet.
#
# Bring up:   docker compose -f docker-compose.prod.yml up -d
services:
  caddy-rdoc:
    build:
      context: .
      dockerfile: deploy/caddy-rdoc/Dockerfile
    image: rdoc-suite-caddy:latest
    container_name: rdoc-suite-caddy
    restart: unless-stopped
    env_file: .env
    network_mode: host
    volumes:
      - ./deploy/caddy-rdoc/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_rdoc_data:/data
      - caddy_rdoc_config:/config
      - ./downloads:/srv/downloads:ro
    depends_on:
      - bridge
      - fleetplanner
      - grafana
      - livekit
      - monitoring

  livekit:
    image: livekit/livekit-server:latest
    container_name: rdoc-suite-livekit
    restart: unless-stopped
    # --node-ip is load-bearing: without it, LiveKit tries to STUN-detect
    # its public IP, but inside a double-NAT Proxmox/LXC setup STUN returns
    # the LXC-internal gateway (e.g. 10.10.10.1) instead of the actual
    # public IP. LiveKit then advertises that internal address to clients
    # as an ICE candidate, ICE never establishes, and audio fails with
    # "could not establish pc connection". Solution: pass the deployer's
    # real public IP explicitly via env. Same pattern as the dev compose
    # uses --node-ip 127.0.0.1 for Docker Desktop on Windows.
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # 7880: nur an Loopback publishen — Traefik (auf demselben Host)
      # nutzt das als Upstream, von extern unerreichbar.
      - "127.0.0.1:7880:7880"
      # WebRTC-Media — extern erreichbar über LXC-101-DNAT.
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      # LIVEKIT_KEYS is LiveKit's native env-var override for the
      # `keys:` block in livekit.yaml. Format: "key: secret" (one pair).
      # docker-compose interpolates the ${...} from .env before the
      # container ever starts — no envsubst step, no template that
      # `git pull` can overwrite, no secret in committed YAML.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  bridge:
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
    image: rdoc-suite-bridge:latest
    container_name: rdoc-suite-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8787"
    # An Loopback binden, damit Traefik via http://127.0.0.1:8787 ranreicht
    # und der Port von extern (durch die LXC-Host-Firewall) nicht offen ist.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # SQLite file lives outside the image so data survives rebuilds.
      # IMPORTANT: mount under /app/data, NOT /app/prisma. Mounting on
      # /app/prisma would shadow the image's prisma/schema.prisma and
      # prisma/migrations/ with whatever the volume happens to contain,
      # which is how a prior parallel deployment (better-architecture
      # branch) silently took over our schema. DATABASE_URL in .env must
      # point to /app/data/prod.db (the volume) — not /app/prisma/prod.db.
      # For Postgres, drop this mount and point DATABASE_URL at the DB.
      - bridge_data:/app/data
    depends_on:
      - livekit

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: rdoc-suite-bot:latest
    container_name: rdoc-suite-bot
    restart: unless-stopped
    env_file: .env
    # Shares the bridge's SQLite DB at /app/data/prod.db. The bridge
    # container owns migrations (entrypoint runs `prisma migrate deploy`);
    # the bot only opens the generated client. depends_on ensures the
    # bridge starts first so the schema is in place before the bot connects.
    volumes:
      - bridge_data:/app/data
    depends_on:
      - bridge

  fleetplanner-db:
    image: postgres:16-alpine
    container_name: rdoc-suite-fleetplanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "fleetplanner"
      POSTGRES_PASSWORD: "${FLEETPLANNER_DB_PASSWORD}"
      POSTGRES_DB: "fleetplanner"
    volumes:
      - fleetplanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      # migrate deploy in the app entrypoint races the DB otherwise.
      test: ["CMD-SHELL", "pg_isready -U fleetplanner -d fleetplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  fleetplanner:
    build:
      context: .
      dockerfile: apps/fleetplanner/Dockerfile
    image: rdoc-suite-fleetplanner:latest
    container_name: rdoc-suite-fleetplanner
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3200"
      # Postgres lives in the fleetplanner-db service on the compose network.
      DATABASE_URL: "postgresql://fleetplanner:${FLEETPLANNER_DB_PASSWORD}@fleetplanner-db:5432/fleetplanner?schema=public"
      WEB_PUBLIC_URL: "${FLEETPLANNER_PUBLIC_URL:-https://suite.raumdock.org}"
      PUBLIC_BASE_PATH: "/fleetplanner"
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      fleetplanner-db:
        condition: service_healthy

  error-page:
    build:
      context: .
      dockerfile: apps/error-page/Dockerfile
    image: rdoc-suite-error-page:latest
    container_name: rdoc-suite-error-page
    restart: unless-stopped
    environment:
      PORT: "9091"
    ports:
      - "127.0.0.1:9091:9091"

  relay-bots:
    build:
      context: apps/relay-bots
      dockerfile: Dockerfile
    image: rdoc-suite-relay-bots:latest
    container_name: rdoc-suite-relay-bots
    restart: unless-stopped
    environment:
      CONFIG_PATH: "/app/data/config.json"
      # Bind 0.0.0.0 inside the container so Prometheus can scrape /metrics
      # over the docker network; the host port below is published to
      # 127.0.0.1 only. ADMIN_PASSWORD is required now — the admin server
      # fails closed (refuses to start) on a non-loopback bind without it.
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "8788"
      ADMIN_PASSWORD: "${RELAY_ADMIN_PASSWORD:?set RELAY_ADMIN_PASSWORD in .env}"
    # Mount a config.json you create on the host — see apps/relay-bots/config.example.json.
    # Minimal bridge-backed config:
    #   { "bridge": { "url": "http://bridge:8787", "serviceSecret": "<RELAY_BOTS_SECRET>" },
    #     "livekit": { "url": "wss://voice.raumdock.org", "apiKey": "x", "apiSecret": "x", "relayRoomName": "voice-relay" },
    #     "discord": { "guildId": "0", "bots": [] } }
    # (livekit/discord placeholders are overwritten by the bridge service-config endpoint)
    volumes:
      - ./data/relay-bots:/app/data
    ports:
      # Admin API (metrics/reload) — localhost only, scraped by Prometheus.
      - "127.0.0.1:8788:8788"
    depends_on:
      - bridge

  monitoring:
    build:
      context: .
      dockerfile: apps/monitoring/Dockerfile
    image: rdoc-suite-monitoring:latest
    container_name: rdoc-suite-monitoring
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - monitoring_data:/prometheus
    depends_on:
      - bridge
      - livekit
      - relay-bots
      - alertmanager
      - node-exporter

  # Alert routing → Discord. No public port; UI bound to loopback only.
  # The Discord webhook URL is a host-side file secret (see
  # deploy/alertmanager/secret/discord-webhook-url).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: rdoc-suite-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/alertmanager/secret:/etc/alertmanager/secret:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  # Host CPU / RAM / disk metrics. No published port — scraped only over the
  # internal docker network by Prometheus. Never expose this to the internet.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: rdoc-suite-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run)($$|/)"
    pid: host
    volumes:
      - "/:/host:ro,rslave"

  grafana:
    image: grafana/grafana:latest
    container_name: rdoc-suite-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_SERVER_ROOT_URL: "https://monitoring.raumdock.org/"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - monitoring

volumes:
  bridge_data:
  caddy_rdoc_config:
  caddy_rdoc_data:
  fleetplanner_pgdata:
  grafana_data:
  monitoring_data:
  alertmanager_data:
