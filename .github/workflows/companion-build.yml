name: Build Companion (Windows)

# Trigger: push a tag like companion-v0.5.1
# This creates a GitHub Release with the NSIS installer as an asset.
# The bridge's updater (GITHUB_REPO=cccdemon/RDOC-Suite) picks it up automatically.
on:
  push:
    tags:
      - 'companion-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. companion-v0.5.1)'
        required: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @rdoc-suite/shared
        run: pnpm --filter @rdoc-suite/shared build

      - name: Build companion (Tauri)
        run: pnpm --filter @rdoc-suite/companion tauri:build

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $t = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          "name=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Companion ${{ steps.tag.outputs.name }}
          files: apps/companion/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
